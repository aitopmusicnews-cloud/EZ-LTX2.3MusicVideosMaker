name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Agnes regression tests
        run: npx tsx --test apps/api/src/agnes_core.test.ts apps/api/src/agnes_http.test.ts apps/api/src/agnes_routes.test.ts
      - name: Build workspaces
        run: npm run build
