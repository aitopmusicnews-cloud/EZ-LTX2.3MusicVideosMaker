name: Build Check

on:
  push:
    branches: [main, feature/director-vision-first-clips]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Director vision-first regression tests
        run: npx tsx --test apps/web/src/lib/directorVisionParser.test.ts apps/web/src/lib/directorPlan.test.ts apps/web/src/lib/directorGeneration.test.ts apps/web/src/components/AutoDirector.vision-first.test.ts
      - name: Build workspaces
        run: npm run build
