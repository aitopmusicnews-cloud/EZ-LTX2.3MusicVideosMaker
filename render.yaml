services:
  - type: web
    name: music-video-studio
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_AUTH_USERNAME
        value: admin
      - key: API_AUTH_TOKEN
        sync: false
